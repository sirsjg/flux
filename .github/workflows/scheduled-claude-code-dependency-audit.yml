name: Scheduled - Dependency Audit

on:
  schedule:
    # Run every 2 weeks (1st and 15th of each month) at 10 AM UTC
    - cron: '0 10 1,15 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for outdated dependencies
        id: check-outdated
        run: |
          echo "Checking for outdated dependencies..."
          bun outdated --recursive --json > /tmp/outdated.json 2>/dev/null || true

          if [ ! -s /tmp/outdated.json ] || [ "$(cat /tmp/outdated.json)" = "{}" ]; then
            echo "has_outdated=false" >> $GITHUB_OUTPUT
            echo "No outdated dependencies found"
          else
            echo "has_outdated=true" >> $GITHUB_OUTPUT
            echo "Found outdated dependencies"
            cat /tmp/outdated.json
          fi

      - name: Run security audit
        id: security-audit
        run: |
          echo "Running security audit..."
          bun audit --json > /tmp/audit.json 2>/dev/null || true

          if [ -s /tmp/audit.json ]; then
            VULNERABILITIES=$(node -e "const d=require('/tmp/audit.json'); console.log(Object.values(d).reduce((n, advisories) => n + advisories.length, 0))" 2>/dev/null || echo "0")
            echo "vulnerabilities=$VULNERABILITIES" >> $GITHUB_OUTPUT
            echo "Found $VULNERABILITIES vulnerabilities"
          else
            echo "vulnerabilities=0" >> $GITHUB_OUTPUT
          fi

      - name: Claude Dependency Analysis & Update
        if: steps.check-outdated.outputs.has_outdated == 'true' || steps.security-audit.outputs.vulnerabilities != '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
          branch_prefix: claude/deps-update-
          track_progress: true
          prompt: |
            # Dependency Audit

            You are running a scheduled dependency audit.

            ## Your Tasks

            1. **Analyze outdated packages**: Run `bun outdated --recursive` and review results

            2. **Analyze security vulnerabilities**: Run `bun audit` and review results

            3. **Update packages safely**:
               - Use `bun update {package}` for minor/patch updates
               - For major versions, use `bun update {package}@latest` only if safe
               - Use root overrides for vulnerable transitive dependencies only after checking compatibility

            4. **Verify updates**:
               - Run `bun run lint` to check for issues
               - Run `bun test` to verify tests pass
               - If anything fails, revert that specific update

            5. **Create PR** if any updates were made:
               - Create branch from main
               - Commit package.json and bun.lock changes
               - PR title: "chore(deps): update dependencies"
               - PR body should list:
                 - Each package updated with old → new version
                 - Security vulnerabilities fixed (if any)

            ## Guidelines
            - Be CONSERVATIVE - when in doubt, don't update
            - If tests fail after an update, revert that update
            - Group related updates together
            - If NO updates are possible, report that and don't create a PR
          claude_args: |
            --model claude-opus-4-5-20251101
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(bun:*)"

      - name: Report no updates needed
        if: steps.check-outdated.outputs.has_outdated == 'false' && steps.security-audit.outputs.vulnerabilities == '0'
        run: |
          echo "All dependencies are up to date and no security vulnerabilities found."
          echo "No action needed."
