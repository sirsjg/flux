services:
  flux:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-local}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: flux-web
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/packages/data
    environment:
      - FLUX_DATA=/app/packages/data/data.sqlite
      # Bind the container's wildcard so published ports reach it; the mapping
      # above is what decides who can get in from outside.
      - HOST=0.0.0.0
    restart: unless-stopped
